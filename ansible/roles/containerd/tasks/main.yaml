---
- name: Install containerd
  ansible.builtin.apt:
    name: containerd
    state: present
    update_cache: true

- name: Create containerd configuration directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Generate default containerd configuration
  ansible.builtin.shell:
    cmd: containerd config default > /etc/containerd/config.toml
    creates: /etc/containerd/config.toml
- name: Check current SystemdCgroup value
  ansible.builtin.command:
    cmd: grep -E '^[[:space:]]*SystemdCgroup[[:space:]]*=' /etc/containerd/config.toml
  register: systemdcgroup_value
  changed_when: false

- name: Configure containerd to use systemd cgroups
  ansible.builtin.lineinfile:
    path: /etc/containerd/config.toml
    regexp: '^[[:space:]]*SystemdCgroup[[:space:]]*=[[:space:]]*false'
    line: '            SystemdCgroup = true'
  when: "'SystemdCgroup = false' in systemdcgroup_value.stdout"
  notify: Restart containerd

- name: Enable and start containerd
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started

