---
- name: Initialize Kubernetes cluster
  ansible.builtin.command:
    cmd: >
      kubeadm init
      --apiserver-advertise-address={{ kubernetes_api_endpoint }}
      --pod-network-cidr=192.168.0.0/16
      --cri-socket=unix:///run/containerd/containerd.sock
    creates: /etc/kubernetes/admin.conf
  register: kubeadm_init

- name: Create kubeconfig directory
  ansible.builtin.file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

- name: Copy admin kubeconfig
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/ubuntu/.kube/config
    remote_src: true
    owner: ubuntu
    group: ubuntu
    mode: "0600"

- name: Install Calico
  become_user: ubuntu
  ansible.builtin.command:
    cmd: >
      kubectl apply
      -f https://raw.githubusercontent.com/projectcalico/calico/v3.30.3/manifests/calico.yaml
    environment:
      KUBECONFIG: /home/ubuntu/.kube/config
  when: kubeadm_init.changed

- name: Generate worker join command
  ansible.builtin.command:
    cmd: kubeadm token create --print-join-command
  register: join_command
  changed_when: false

- name: Print Kubernetes join command
  ansible.builtin.debug:
    msg: "{{ join_command.stdout }}"

- name: Save join command to a file on Ansible controller
  ansible.builtin.copy:
    content: "{{ join_command.stdout }} --cri-socket={{ containerd_socket }}\n"
    dest: /tmp/kubeadm-join.sh
    mode: "0700"
  delegate_to: localhost
  become: false
  no_log: true
  
- name: Save join command
  ansible.builtin.set_fact:
    kubeadm_join_command: "{{ join_command.stdout }}"

- name: Install Calico CNI
  ansible.builtin.command:
    cmd: >-
      kubectl apply -f
      https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/calico.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: calico_apply
  changed_when: >-
    'created' in calico_apply.stdout or
    'configured' in calico_apply.stdout
