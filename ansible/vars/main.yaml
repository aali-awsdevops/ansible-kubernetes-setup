
---
# Common packages
common_packages:
  - curl
  - zip
  - ca-certificates
  - wget
  - apt-transport-https
  - gpg

# Kubernetes packages
kubernetes_packages:
  - kubeadm
  - kubelet
  - kubectl

# Kubernetes version repository (minor version)
kubernetes_version: "1.37"

# Exact package versions are not pinned here.
# Use explicit package versions if exact patch consistency is required.

# Pod network CIDR
pod_network_cidr: "192.168.0.0/16"

# Kubernetes service network CIDR
service_network_cidr: "10.96.0.0/12"

# Container runtime
containerd_socket: "unix:///var/run/containerd/containerd.sock"

# Calico version
calico_version: "v3.33.0"

# Kubernetes API endpoint
# Master's private IP for internal VPC communication
kubernetes_api_endpoint: "10.0.3.10:6443"
private_ip: "10.0.3.10"
# API server certificate SANs
kubernetes_api_cert_sans:
  - "10.0.3.10"

# Ubuntu SSH user
ansible_user: ubuntu
